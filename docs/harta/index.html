<title>Harta Super Admin — gama.md, platformă, reguli</title>
<style>
  :root { --bg:#fbfaf8; --fg:#1d1d1f; --mut:#6b6b70; --card:#fff; --line:#e3e1dc; --ram:#e64980; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; background:var(--card); }
  header h1 { font-size:16px; margin:0 6px 0 0; }
  .tab, .btn { padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); cursor:pointer; font-size:13px; }
  .tab.on { background:var(--fg); color:#fff; border-color:var(--fg); font-weight:600; }
  header label { display:flex; gap:5px; align-items:center; color:var(--mut); font-size:13px; cursor:pointer; }
  header input[type=search] { padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); min-width:190px; }
  main { flex:1; display:flex; min-height:0; }
  #stanga { flex:1; min-width:0; position:relative; }
  #mm, #graf { position:absolute; inset:0; }
  #graf { display:none; }
  #mm svg { width:100%; height:100%; cursor:grab; }
  .ram { fill:none; stroke-width:1.8; opacity:.9; }
  .dep { fill:none; pointer-events:stroke; cursor:help; }
  .nod text { pointer-events:none; }
  .nod rect { cursor:pointer; }
  .nod.dim { opacity:.25; }
  .plus { font-size:11px; fill:#fff; font-weight:700; pointer-events:none; }
  aside { width:340px; border-left:1px solid var(--line); background:var(--card); overflow:auto; padding:14px 16px; }
  aside h2 { font-size:15px; margin:0 0 6px; }
  aside h3 { font-size:12px; margin:12px 0 4px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  aside .mut { color:var(--mut); font-size:12.5px; }
  aside ul { padding-left:16px; margin:4px 0 10px; }
  aside li { margin:3px 0; }
  .leg { display:grid; grid-template-columns:22px 1fr; gap:5px 8px; align-items:center; font-size:12.5px; margin:6px 0 10px; }
  .sw { width:20px; height:14px; border-radius:3px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); margin:0 4px 4px 0; }
  .regula { border-left:3px solid #0b7a3b; padding:6px 8px; background:rgba(11,122,59,.07); font-size:12.5px; margin:8px 0; }
  a { color:inherit; }
  details.csec { margin:4px 0 8px; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fafafa; }
  details.csec > summary { cursor:pointer; font-size:13px; }
  details.crul { margin:3px 0 3px 4px; font-size:12.5px; }
  details.crul > summary { cursor:pointer; }
  .crul0 { margin:3px 0 3px 18px; font-size:12.5px; }
  .ctx { margin:2px 0 6px 16px; padding:4px 8px; border-left:2px solid var(--line); color:#333; font-size:12.5px; background:#fff; }
  @media (max-width:760px){ main{flex-direction:column;} aside{width:auto;height:42%;border-left:0;border-top:1px solid var(--line);} }
</style>
</head>
<body>
<header>
  <h1>Harta Super Admin — gama.md</h1>
  <button class="tab on" data-v="mm">Hartă</button>
  <button class="tab" data-v="flux">Legături (flux)</button>
  <button class="btn" id="reset">Resetează aranjarea</button>
  <input id="cauta" type="search" placeholder="Caută (ex. MAIB, sync, URL)…">
  <label><input type="checkbox" id="fIdei" checked> idei / planificate</label>
  <label id="lExt" style="display:none"><input type="checkbox" id="fExt"> sisteme externe</label>
</header>
<main>
  <div id="stanga"><div id="mm"></div><div id="graf"></div></div>
  <aside id="panou"></aside>
</main>

function cuprinsHTML(id, deschis){
  const C = CUPRINS[id]; if (!C) return '';
  const nr = C.reduce((s,[,it]) => s + it.length, 0);
  return `<h3>Cuprins (${nr}) <span style="float:right;text-transform:none;font-weight:400"><a href="#" class="cdes">desfășoară tot</a> · <a href="#" class="cstr">strânge tot</a></span></h3>` +
    C.map(([t, it]) => `<details class="csec" ${deschis?'open':''}><summary><b>${t}</b> <span class="mut">(${it.length})</span></summary>` +
      it.map(([c,n,st,tx]) => tx ? `<details class="crul"><summary><b>${c}</b> ${n} <span class="mut">${st}</span></summary><div class="ctx">${tx}</div></details>`
                                 : `<div class="crul0"><b>${c}</b> ${n} <span class="mut">${st}</span></div>`).join('') + `</details>`).join('');
}
function legaCuprins(){
  panou.querySelectorAll('.cdes').forEach(a => a.onclick = e => { e.preventDefault(); panou.querySelectorAll('details').forEach(d => d.open = true); });
  panou.querySelectorAll('.cstr').forEach(a => a.onclick = e => { e.preventDefault(); panou.querySelectorAll('details.crul').forEach(d => d.open = false); });
}

let net = null;
const graf = document.getElementById('graf');
function refaGraf(){
  const ext = fExt.checked, idei = fIdei.checked;
  const legati = new Set(); LEG.filter(l => idei || l[3]!=='p').forEach(l => { legati.add(l[0]); legati.add(l[1]); });
  const N = [], E = [];
  INSTR.forEach(([id,n,,st,ts]) => { if (!legati.has(id) || (!idei && st==='idee')) return;
    const cp = culoriProiect(info[id]);
    N.push({ id, label:n, shape:'box', margin:7, widthConstraint:{maximum:200}, color:{background:cp.bg,border:cp.c,highlight:{background:cp.bg,border:'#111'}},
      borderWidth:cp.w, shapeProperties:{borderDashes:cp.d ? cp.d.split(',').map(Number) : false,borderRadius:6}, font:{size:12.5,face:'system-ui',color:'#1d1d1f'} }); });
  DEPOZITE.forEach(([id,n]) => { if (legati.has(id)) N.push({ id, label:n, shape:'database', color:{background:'#eef2f7',border:'#5f6672'}, font:{size:12,color:'#1d1d1f'} }); });
  [...PRODUSE.map(x=>x[0])].forEach(id => { if (legati.has(id)) N.push({ id, label:nume(id), shape:'ellipse', color:{background:'#fff',border:'#8a8f98'}, font:{size:12,color:'#1d1d1f'} }); });
  if (ext) EXT.forEach(([id,n]) => { if (legati.has(id)) N.push({ id, label:n, shape:'ellipse', color:{background:'#f3f4f6',border:'#9aa3b2'}, font:{size:12,color:'#1d1d1f'} }); });
  const ids = new Set(N.map(n=>n.id));
  LEG.forEach(([f,t,l,k],i) => { if (ids.has(f) && ids.has(t) && (idei || k!=='p')) E.push({ id:'l'+i, from:f, to:t, label:l, arrows:'to', dashes:k!=='f'&&k!=='r', width:k==='r'?2:k==='f'?1.6:1.1,
    color:{color:k==='r'?'#5f6672':k==='f'?'#3d5a99':'#9aa3b2',highlight:'#111'}, font:{size:10.5,color:'#55565c',strokeWidth:3,strokeColor:'#fff'}, smooth:{type:'cubicBezier',forceDirection:'horizontal',roundness:0.4} }); });
  const data = { nodes:new vis.DataSet(N), edges:new vis.DataSet(E) };
  if (!net) {
    net = new vis.Network(graf, data, { physics:false, interaction:{hover:true}, layout:{ hierarchical:{ enabled:true, direction:'LR', sortMethod:'directed', levelSeparation:290, nodeSpacing:58, treeSpacing:70, blockShifting:true, edgeMinimization:true, parentCentralization:true } } });
    net.on('click', p => { if (p.nodes.length) arata(p.nodes[0]); });
  } else net.setData(data);
}
function incarca(urls, gata){ const u=urls.shift(); if(!u){ alert0(); return; } const s=document.createElement('script'); s.src=u; s.onload=gata; s.onerror=()=>incarca(urls,gata); document.head.appendChild(s); }
